name: Release npm package

# Build ownership lives here (the TypeScript binding repository): each matrix
# runner checks out the exact core tag, enables CORTEXT_BUILD_NODE_BINDINGS,
# and uploads only its cortext.node. The publish job cannot run until the
# collector has all six artifacts and has written a matching manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Binding release tag (for example v1.3.0)"
        required: false
        default: ""
      core_tag:
        description: "Exact augmem/cortext.cpp tag; replace the placeholder with the follow-up Node text-media core tag"
        required: true
        default: "REPLACE_WITH_MATCHING_CORE_TAG"


permissions:
  contents: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      core_tag: ${{ steps.version.outputs.core_tag }}
    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            REF="$INPUT_TAG"
          else
            REF="${GITHUB_REF}"
          fi
          echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}

      - name: Resolve binding and core versions
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CORE_TAG: ${{ inputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          # Pushes default to the same versioned core tag. Manual dispatch is
          # intentionally explicit so a follow-up core tag can be consumed.
          if [[ -n "$INPUT_CORE_TAG" && "$INPUT_CORE_TAG" != "REPLACE_WITH_MATCHING_CORE_TAG" ]]; then
            CORE_TAG="$INPUT_CORE_TAG"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && -z "$INPUT_TAG" ]]; then
            CORE_TAG="v${VERSION}"
          else
            echo "core_tag is required: replace the workflow placeholder with the matching augmem/cortext.cpp tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "core_tag=$CORE_TAG" >> "$GITHUB_OUTPUT"
          echo "binding=$TAG core=$CORE_TAG"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: win32-x64
            os: windows-2022
          - target: win32-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build ${{ matrix.target }} from core tag
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          set -euo pipefail
          node scripts/build-prebuild.mjs \
            --core-tag "$CORE_TAG" \
            --target "$TARGET" \
            --output "$RUNNER_TEMP/cortext-prebuild"

      - name: Upload matrix prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: ${{ runner.temp }}/cortext-prebuild/${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Download all six matrix prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: ${{ runner.temp }}/cortext-prebuild-input
          merge-multiple: false

      - name: Collect and validate all six prebuilds
        env:
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collect-prebuilds.mjs \
            --input "$RUNNER_TEMP/cortext-prebuild-input" \
            --output prebuilds \
            --core-tag "$CORE_TAG" \
            --force
          node scripts/check-prebuilds.mjs --core-tag "$CORE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build and test package with collected natives
        env:
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          set -euo pipefail
          npm test
          node scripts/check-prebuilds.mjs --core-tag "$CORE_TAG"
          npm pack --dry-run

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          TGZ="$(ls augmem-cortext-*.tgz | head -1)"
          NOTES="$(mktemp)"
          {
            echo "## @augmem/cortext ${{ needs.resolve.outputs.version }}"
            echo
            echo "N-API prebuilds built by the TypeScript package pipeline from augmem/cortext.cpp@$CORE_TAG."
            echo
            echo '```bash'
            echo "npm install @augmem/cortext@${{ needs.resolve.outputs.version }}"
            echo '```'
          } > "$NOTES"
          gh release create "${{ needs.resolve.outputs.tag }}" "$TGZ" \
            --title "cortext.ts ${{ needs.resolve.outputs.version }}" \
            --notes-file "$NOTES" \
            --verify-tag || gh release upload "${{ needs.resolve.outputs.tag }}" "$TGZ" --clobber
