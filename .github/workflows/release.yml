name: Release npm package

# Publishes @augmem/cortext to the npm registry on version tags.
# Prebuilds must be vendored into the release artifact (from monorepo or
# a prior npm package) before publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.4). Empty = package.json version."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} (${VERSION})"

      - name: Vendor all platform prebuilds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 1) Sibling monorepo (optional multi-checkout)
          if [[ -d ../cortext/bindings/javascript/prebuilds ]]; then
            node scripts/vendor-prebuilds.mjs --from ../cortext/bindings/javascript/prebuilds --force
          else
            # 2) Pack from last published npm package and reuse its prebuilds
            mkdir -p /tmp/cortext-prebuild-src
            npm pack "@augmem/cortext@${{ steps.ver.outputs.version }}" --pack-destination /tmp/cortext-prebuild-src \
              || npm pack "@augmem/cortext" --pack-destination /tmp/cortext-prebuild-src
            tar -xzf /tmp/cortext-prebuild-src/*.tgz -C /tmp/cortext-prebuild-src
            node scripts/vendor-prebuilds.mjs --from /tmp/cortext-prebuild-src/package/prebuilds --force
          fi
          node scripts/check-prebuilds.mjs

      - name: Build and test
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer trusted publishing when configured; NODE_AUTH_TOKEN for classic tokens.
          npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          npm pack
          TGZ="$(ls augmem-cortext-*.tgz | head -1)"
          NOTES="$(mktemp)"
          {
            echo "## @augmem/cortext ${{ steps.ver.outputs.version }}"
            echo
            echo "TypeScript/JavaScript bindings for Cortext (cortext.ts)."
            echo
            echo '```bash'
            echo "npm install @augmem/cortext@${{ steps.ver.outputs.version }}"
            echo '```'
          } > "$NOTES"
          gh release create "$TAG" "$TGZ" \
            --title "cortext.ts ${{ steps.ver.outputs.version }}" \
            --notes-file "$NOTES" \
            --verify-tag || gh release upload "$TAG" "$TGZ" --clobber
