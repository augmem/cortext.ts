name: Release npm package

# Build ownership lives here (the TypeScript binding repository): each matrix
# runner checks out the immutable binding commit, then builds the exact core
# tag with CORTEXT_BUILD_NODE_BINDINGS=ON and uploads only its cortext.node.
# The publish job cannot run until the collector has all six artifacts and has
# written a matching manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Binding release tag (for example v1.3.0)"
        required: false
        default: ""
      core_tag:
        description: "Exact augmem/cortext.cpp tag; replace the placeholder with the follow-up Node text-media core tag"
        required: true
        default: "REPLACE_WITH_MATCHING_CORE_TAG"


permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      checkout_sha: ${{ steps.version.outputs.checkout_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      core_tag: ${{ steps.version.outputs.core_tag }}
    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            [[ "$INPUT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][A-Za-z0-9.-]+)?$ ]] || {
              echo "tag input must be a strict vMAJOR.MINOR.PATCH semver" >&2
              exit 1
            }
            REF="$INPUT_TAG"
          else
            REF="${GITHUB_REF}"
          fi
          [[ "$REF" != *$'\n'* && "$REF" != *$'\r'* ]] || exit 1
          printf 'checkout_ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate immutable release
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CORE_TAG: ${{ inputs.core_tag }}
        run: node scripts/resolve-release.mjs

  build:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-14
          - target: win32-x64
            os: windows-2022
          - target: win32-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build ${{ matrix.target }} from core tag
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          set -euo pipefail
          node scripts/build-prebuild.mjs \
            --core-tag "$CORE_TAG" \
            --target "$TARGET" \
            --output "$RUNNER_TEMP/cortext-prebuild"

      - name: Upload matrix prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          # Preserve <target>/cortext.node inside the downloaded artifact.
          path: ${{ runner.temp }}/cortext-prebuild
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Checkout exact core tag for independent provenance proof
        uses: actions/checkout@v4
        with:
          repository: augmem/cortext.cpp
          ref: ${{ needs.resolve.outputs.core_tag }}
          path: core-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Download all six matrix prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: ${{ runner.temp }}/cortext-prebuild-input
          merge-multiple: false

      - name: Collect and validate all six prebuilds
        env:
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          CORE_DIR="$GITHUB_WORKSPACE/core-checkout"
          CORE_COMMIT="$(git -C "$CORE_DIR" rev-parse HEAD)"
          CORE_CHECKED_TAG="$(git -C "$CORE_DIR" describe --tags --exact-match HEAD)"
          [[ "$CORE_CHECKED_TAG" == "$CORE_TAG" ]]
          [[ "$CORE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          node scripts/collect-prebuilds.mjs \
            --input "$RUNNER_TEMP/cortext-prebuild-input" \
            --output prebuilds \
            --core-tag "$CORE_TAG" \
            --core-dir "$CORE_DIR" \
            --expected-core-commit "$CORE_COMMIT" \
            --force
          node scripts/check-prebuilds.mjs --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT"

      - name: Install dependencies
        run: npm ci

      - name: Build and run model-independent release tests
        env:
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          set -euo pipefail
          # Release runners validate packaging, declarations, provenance, and
          # wrapper contracts without downloading the 142 MiB AIST GGUF.
          npm run test:release
          node scripts/check-prebuilds.mjs --core-tag "$CORE_TAG"
          npm pack --dry-run

      - name: Pack exact release tarball
        id: pack
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          TGZ="$(node scripts/verify-release-package.mjs \
            --pack-json "$RUNNER_TEMP/npm-pack.json" \
            --version "$RELEASE_VERSION")"
          printf 'file=%s\n' "$TGZ" >> "$GITHUB_OUTPUT"

      - name: Verify release tag commit before publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.checkout_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-github-tag.mjs

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create or upload GitHub Release without clobbering
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
          TGZ: ${{ steps.pack.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## @augmem/cortext $RELEASE_VERSION"
            echo
            echo "N-API prebuilds built by the TypeScript package pipeline from augmem/cortext.cpp@$CORE_TAG."
            echo
            echo '```bash'
            echo "npm install @augmem/cortext@$RELEASE_VERSION"
            echo '```'
          } > "$NOTES"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading exact tarball without clobber"
            gh release upload "$RELEASE_TAG" "$TGZ"
          else
            gh release create "$RELEASE_TAG" "$TGZ" \
              --title "cortext.ts $RELEASE_VERSION" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
